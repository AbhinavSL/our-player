<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>

  <title>Our Playlist ❤️</title>

  <link rel="stylesheet" href="style.css">

  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>

<body>

<div class="background-image"></div>

<div class="background"></div>

<div class="player">

  <div class="top-bar">
    <span>♡ OUR SONG</span>
    <span>16:01</span>
  </div>

  <div class="cover-container">
    <img src="images/cover.jpg" class="cover" id="cover">
  </div>

  <div class="song-details">
    <h1 id="songName">Until I Found You</h1>
    <p id="artistName">Stephen Sanchez</p>
  </div>

  <div class="progress-container">
    <div class="progress-bar" id="progressBar">
        <div class="progress" id="progress"></div>

        <div class="thumb" id="thumb"></div>
    </div>

    <div class="time">
      <span id="current">0:00</span>
      <span id="duration">0:00</span>
    </div>
  </div>

  <div class="controls">
    <button id="prevBtn">⏮</button>

    <button class="play-btn" id="playBtn">
      ▶
    </button>

    <button id="nextBtn">⏭</button>
  </div>

  <div class="voice-card">
    <p>SECRET MESSAGE</p>

    <h3>Play when you miss me ❤️</h3>

    <button id="voiceBtn">
      PLAY VOICE NOTE
    </button>
  </div>

  <div class="quote">
    “You became my favorite place without even realizing it.”
  </div>

</div>

<audio id="song"></audio>
<audio id="voice" src="voice.mp3"></audio>

<script src="script.js"></script>

</body>
</html>
